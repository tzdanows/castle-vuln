[package]
name = "castle-vuln"
version = "0.1.0"
edition = "2021"
description = "Castle's second test target: a small axum service with deliberate vulnerabilities in code and in dependencies."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
# Pinned on purpose so Dependabot and Trivy have something to find:
# regex 1.5.4: RUSTSEC-2022-0013 / GHSA-m5pq-gvj9-9vr8, ReDoS, fixed in 1.5.5.
regex = "=1.5.4"
# time 0.1.43: RUSTSEC-2020-0071 / GHSA-wcg3-cvx6-7396, segfault, fixed in 0.2.23.
time = "=0.1.43"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
